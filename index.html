<!DOCTYPE html>

<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>国家試験対策演習アプリ</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Shippori+Mincho+B1:wght@600;700&display=swap" rel="stylesheet">
<style>
        :root {
            --primary: #2f4a7d;
            --primary-hover: #243a66;
            --primary-light: #edf1f8;
            --accent: #c08a2d;
            --bg: #f5f1e8;
            --card-bg: #fffdf7;
            --text-main: #26282e;
            --text-sub: #7a7568;
            --border: #e3dcc9;
            --success: #2e7d5b;
            --success-bg: #e8f4ec;
            --error: #bf443c;
            --error-bg: #faedeb;
            --warning-bg: #fdf6e0;
            --warning-border: #d9a441;
            --highlight: #c2410c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        ::selection { background: #dbe4f3; }

        body {
            font-family: "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            max-width: 820px;
            margin: 0 auto;
            padding: 70px 16px 48px;
            background-color: var(--bg);
            background-image:
                radial-gradient(ellipse 90% 340px at 50% -60px, rgba(47, 74, 125, 0.13), transparent 70%),
                radial-gradient(rgba(47, 74, 125, 0.055) 1px, transparent 1.4px);
            background-size: auto, 22px 22px;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        /* --- ポータル戻るボタン --- */
        .portal-back-btn {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-400px);
            z-index: 1000;
            text-decoration: none;
            background: rgba(255, 253, 247, 0.92);
            padding: 8px 16px;
            border-radius: 999px;
            box-shadow: 0 2px 10px rgba(38, 40, 46, 0.07);
            border: 1px solid var(--border);
            color: var(--primary);
            font-size: 0.85rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
        }

        @media (max-width: 840px) {
            .portal-back-btn { position: fixed; left: 16px; top: 16px; transform: none; }
            body { padding-top: 75px; }
        }

        .portal-back-btn:hover { background: #ffffff; box-shadow: 0 6px 16px rgba(38, 40, 46, 0.12); transform: translateX(-400px) translateY(-1px); }
        @media (max-width: 840px) {
            .portal-back-btn:hover { transform: translateY(-1px); }
        }

        .app-header { text-align: center; margin-bottom: 26px; }
        .app-title {
            font-family: "Shippori Mincho B1", "Hiragino Mincho ProN", serif;
            font-size: 1.65rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .app-header::after {
            content: "";
            display: block;
            width: 54px;
            height: 3px;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            margin: 12px auto 0;
        }

        .card {
            background: var(--card-bg);
            padding: 30px 28px;
            border-radius: 22px;
            box-shadow: 0 12px 32px rgba(38, 40, 46, 0.06), 0 2px 6px rgba(38, 40, 46, 0.05);
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .screen-section { display: none; }
        .screen-section.active { display: block; animation: fadeUp 0.35s ease; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .status {
            text-align: center;
            font-size: 0.88rem;
            color: var(--primary-hover);
            margin-bottom: 22px;
            padding: 9px 14px;
            background: var(--primary-light);
            border-radius: 999px;
            font-weight: 600;
        }

        .filter-group { display: flex; flex-direction: column; gap: 22px; margin-bottom: 26px; }
        .form-control { display: flex; flex-direction: column; gap: 8px; }
        .form-control label { font-size: 0.88rem; font-weight: 700; color: #3c4048; letter-spacing: 0.02em; }

        select, input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1.5px solid var(--border);
            font-size: 1rem;
            font-family: inherit;
            background: #fff;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            appearance: none;
            -webkit-appearance: none;
        }

        select {
            background-image: linear-gradient(45deg, transparent 50%, var(--text-sub) 50%), linear-gradient(135deg, var(--text-sub) 50%, transparent 50%);
            background-position: calc(100% - 20px) 55%, calc(100% - 14px) 55%;
            background-size: 6px 6px;
            background-repeat: no-repeat;
            padding-right: 40px;
        }

        select:focus, input[type="number"]:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(47, 74, 125, 0.15); }

        .range-inputs { display: flex; align-items: center; gap: 8px; }
        .range-inputs span { color: var(--text-sub); font-weight: 700; }

        .subject-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }

        .btn-quick {
            background: #fff;
            border: 1px solid var(--border);
            color: #5b6068;
            padding: 6px 13px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-quick:hover { background: var(--primary-light); border-color: var(--primary); color: var(--primary-hover); }

        .subject-category-title {
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            color: var(--text-sub);
            margin: 14px 0 7px 2px;
            padding-bottom: 3px;
            border-bottom: 1px dashed var(--border);
        }

        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 8px;
        }

        .subject-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            background: #fff;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            transition: all 0.15s ease;
        }

        .subject-chip:hover { border-color: var(--primary); background: var(--primary-light); transform: translateY(-1px); }

        .subject-chip input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .subject-chip.checked {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--primary-hover);
            box-shadow: inset 0 0 0 1px var(--primary);
        }

        .btn-primary {
            background: linear-gradient(135deg, #3a5a94, var(--primary) 55%, var(--primary-hover));
            color: white;
            border: none;
            padding: 16px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 1.05rem;
            font-family: inherit;
            width: 100%;
            font-weight: 700;
            letter-spacing: 0.04em;
            box-shadow: 0 8px 20px rgba(47, 74, 125, 0.28);
            transition: all 0.2s ease;
        }

        .btn-primary:hover:not(:disabled) { filter: brightness(1.07); transform: translateY(-1px); box-shadow: 0 10px 24px rgba(47, 74, 125, 0.32); }
        .btn-primary:disabled { background: #cfd4dc; cursor: not-allowed; box-shadow: none; }

        .quiz-meta { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
        .progress-bar-container { width: 100%; height: 8px; background: #e9e4d3; border-radius: 10px; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, var(--primary), #7d9bd1); border-radius: 10px; width: 0%; transition: width 0.3s ease; }
        .quiz-info-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: var(--text-sub); font-weight: 700; }

        .category-badges { display: flex; flex-wrap: wrap; gap: 6px; }
        .badge { font-size: 0.75rem; padding: 4px 10px; border-radius: 999px; background: #f1ecdd; color: #6d675a; font-weight: 700; }
        .badge-subject { background: var(--primary); color: #fff; }

        #question-text { font-weight: 700; font-size: 1.16rem; margin-bottom: 24px; color: var(--text-main); line-height: 1.75; }

        .options-grid { display: flex; flex-direction: column; gap: 12px; }
        .option-btn {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            width: 100%;
            text-align: left;
            padding: 16px;
            border: 1.5px solid var(--border);
            border-radius: 16px;
            cursor: pointer;
            background: #fff;
            font-size: 0.98rem;
            font-family: inherit;
            color: var(--text-main);
            line-height: 1.55;
            transition: all 0.15s ease;
        }

        .option-num {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 27px;
            height: 27px;
            border-radius: 50%;
            border: 1.5px solid var(--border);
            background: #faf7ee;
            color: var(--text-sub);
            font-weight: 700;
            font-size: 0.85rem;
            flex-shrink: 0;
            margin-top: 1px;
            transition: all 0.15s ease;
        }

        .option-btn:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-light); transform: translateY(-1px); box-shadow: 0 6px 14px rgba(47, 74, 125, 0.10); }
        .option-btn:hover:not(:disabled) .option-num { background: var(--primary); border-color: var(--primary); color: white; }

        .correct { background-color: var(--success-bg) !important; border-color: var(--success) !important; color: #14503a !important; font-weight: 600; }
        .correct .option-num { background: var(--success) !important; border-color: var(--success) !important; color: white !important; }

        .wrong { background-color: var(--error-bg) !important; border-color: var(--error) !important; color: #7c2d27 !important; }
        .wrong .option-num { background: var(--error) !important; border-color: var(--error) !important; color: white !important; }

        /* 赤字強調用スタイル */
        .highlight {
            color: var(--highlight);
            font-weight: 800;
        }

        .explanation {
            margin-top: 24px;
            padding: 20px 22px;
            background: var(--warning-bg);
            border: 1px solid #efdfae;
            border-left: 6px solid var(--warning-border);
            border-radius: 14px;
            display: none;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        .explanation-title { color: #8a5f0e; font-weight: 800; font-size: 1rem; margin-bottom: 8px; }
        .explanation p { margin: 6px 0; white-space: pre-wrap; line-height: 1.75; color: #4a3b12; }

        .btn-next {
            background: linear-gradient(135deg, #37976e, var(--success) 60%, #256e4e);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            display: none;
            font-size: 1.05rem;
            font-family: inherit;
            font-weight: 700;
            letter-spacing: 0.04em;
            box-shadow: 0 8px 20px rgba(46, 125, 91, 0.26);
            transition: all 0.2s ease;
        }

        .btn-next:hover { filter: brightness(1.06); transform: translateY(-1px); }

        .result-header { text-align: center; margin-bottom: 20px; }
        .result-header h2 {
            font-family: "Shippori Mincho B1", "Hiragino Mincho ProN", serif;
            letter-spacing: 0.04em;
        }
        .score-circle {
            width: 128px; height: 128px; border-radius: 50%; background: #fff;
            color: var(--primary); display: flex; flex-direction: column; align-items: center;
            justify-content: center; margin: 22px auto; border: 3px solid var(--primary-light);
            box-shadow: 0 0 0 6px #fff, 0 0 0 7.5px var(--border), 0 10px 24px rgba(38, 40, 46, 0.08);
        }
        .score-num { font-size: 2.3rem; font-weight: 900; line-height: 1; }
        .score-label { font-size: 0.75rem; font-weight: 700; color: var(--text-sub); margin-top: 5px; }

        .review-section { margin-top: 24px; border-top: 1px solid var(--border); padding-top: 20px; }
        .review-title { font-size: 1rem; color: var(--text-sub); margin-bottom: 12px; font-weight: 700; }
        .review-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }
        .review-item { padding: 11px 13px; background: #fbf8f0; border-radius: 12px; border: 1px solid var(--border); display: flex; align-items: center; font-size: 0.9rem; }
        .review-icon { margin-right: 10px; font-weight: bold; font-size: 1.1rem; width: 24px; text-align: center; }
        .review-item { display: block; }
        .review-details { margin-top: 8px; }
        .review-details summary { cursor: pointer; color: var(--accent, #2f4a7d); font-size: 0.82rem; font-weight: 700; }
        .review-detail-body { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); }
        .review-q { font-weight: 600; margin-bottom: 8px; line-height: 1.6; }
        .review-opt { padding: 5px 9px; border-radius: 8px; margin-bottom: 4px; background: #fff; border: 1px solid var(--border); font-size: 0.86rem; }
        .review-opt.is-correct { background: #ecfdf5; border-color: #6ee7b7; }
        .review-opt.is-wrong { background: #fef2f2; border-color: #fca5a5; }
        .review-exp { margin-top: 8px; background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 9px 11px; font-size: 0.86rem; line-height: 1.6; }
        .study-panel { margin: 18px 0 6px; padding: 14px; background: #fbf8f0; border: 1px solid var(--border); border-radius: 12px; }
        .study-stats { font-size: 0.9rem; font-weight: 700; color: #475569; margin-bottom: 10px; }
        .study-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-weak { background: #b45309; color: #fff; border: none; padding: 10px 14px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 0.9rem; }
        .btn-weak:disabled { background: #d6c9a8; cursor: not-allowed; }
        .study-note { font-size: 0.78rem; color: #64748b; margin-top: 8px; line-height: 1.5; }

    </style>

</head>

<body>



    <a href="https://kaoman0079-ops.github.io/Meridian-Node/" class="portal-back-btn">

        <span>⏎</span> 🏠 Portal

    </a>



    <div class="app-header">

        <h1 class="app-title">📍 国家試験対策演習</h1>

    </div>



    <!-- 条件設定画面 -->

    <div id="setup-area" class="card screen-section active">

        <div id="status-msg" class="status">データ同期中...</div>

        

        <div class="filter-group">

            <div class="form-control">

                <label for="filter-year">試験の回数</label>

                <select id="filter-year"><option value="all">すべて（全回）</option></select>

            </div>



            <div class="form-control">

                <label>教科の選択（複数選択可）</label>

                <div class="subject-actions">

                    <button type="button" class="btn-quick" onclick="selectAllSubjects(true)">全選択</button>

                    <button type="button" class="btn-quick" onclick="selectAllSubjects(false)">全解除</button>

                    <button type="button" class="btn-quick" onclick="selectCategorySubjects('basic')">専門基礎科目のみ</button>

                    <button type="button" class="btn-quick" onclick="selectCategorySubjects('special')">専門科目のみ</button>

                </div>

                <div id="subject-checkboxes-container"></div>

            </div>



                        <div class="form-control">

                <label for="filter-bigcat">分野（大項目）で絞り込む</label>

                <select id="filter-bigcat"><option value="all">すべての大項目</option></select>

            </div>



            <div class="form-control">

                <label for="filter-midcat">分野（中項目）で絞り込む</label>

                <select id="filter-midcat"><option value="all">すべての中項目</option></select>

                <p class="study-note" id="cat-count" style="margin-top:6px;"></p>

            </div>



<div class="form-control">

                <label>出題番号の範囲（例: 1〜20番）</label>

                <div class="range-inputs">

                    <input type="number" id="num-start" placeholder="開始 (1)" min="1">

                    <span>〜</span>

                    <input type="number" id="num-end" placeholder="終了 (20)" min="1">

                </div>

            </div>



            <div class="form-control">

                <label for="order-mode">出題の順番</label>

                <select id="order-mode">

                    <option value="sequential">教科・番号順（順番に解く）</option>

                    <option value="random">ランダム（シャッフル）</option>

                </select>

            </div>



            <div class="form-control">

                <label for="quiz-count">最大出題数</label>

                <select id="quiz-count">

                    <option value="5">5問</option>

                    <option value="10" selected>10問</option>

                    <option value="20">20問</option>

                    <option value="30">30問</option>

                    <option value="999">範囲内の全問を解く</option>

                </select>

            </div>

        </div>



        <div class="study-panel">
            <div id="study-stats" class="study-stats">📊 学習記録を読み込み中...</div>
            <div class="study-actions">
                <button type="button" id="weak-btn" class="btn-weak" onclick="startWeakQuiz()">🎯 苦手問題だけ解く（<span id="weak-count">0</span>問）</button>
                <button type="button" class="btn-quick" onclick="clearWrong()">苦手リストをリセット</button>
            </div>
            <p class="study-note">間違えた問題は自動で「苦手リスト」に貯まります。苦手モードで正解するとリストから外れます。記録はこの端末内に保存されます。</p>
        </div>

        <button id="start-btn" class="btn-primary" onclick="startQuiz()" disabled>同期をお待ちください</button>

    </div>



    <!-- 問題演習画面 -->

    <div id="quiz-area" class="card screen-section">

        <div class="quiz-meta">

            <div class="quiz-info-row">

                <span id="quiz-progress-text">1/10問</span>

                <span id="quiz-exam-info"></span>

            </div>

            <div class="progress-bar-container">

                <div id="progress-bar" class="progress-bar"></div>

            </div>

            <div class="category-badges">

                <span id="badge-subject" class="badge badge-subject">教科</span>

                <span id="badge-category" class="badge" style="display:none;"></span>

            </div>

        </div>



        <div id="question-text"></div>

        <div id="options-container" class="options-grid"></div>



        <div id="explanation-box" class="explanation">

            <div class="explanation-title">💡 解説・解答</div>

            <div id="explanation-text"></div>

        </div>



        <button id="next-btn" class="btn-next" onclick="nextQuestion()">次の問題へ進む ➔</button>

    </div>



    <!-- 結果画面 -->

    <div id="result-area" class="card screen-section">

        <div class="result-header">

            <h2>演習終了！お疲れ様でした</h2>

            <div class="score-circle">

                <span id="score-percentage" class="score-num">0%</span>

                <span id="score-detail" class="score-label">0 / 0 正解</span>

            </div>

        </div>



        <div class="review-section">

            <div class="review-title">📑 今回の出題リスト</div>

            <ul id="review-list" class="review-list"></ul>

        </div>



        <button class="btn-primary" onclick="location.reload()" style="margin-top: 24px;">もう一度解く / 設定へ戻る</button>

    </div>



    <script>

        const DATA_URL = 'data.csv'; 

        let masterData = [];

        let quizSet = [];

        let currentIndex = 0;

        let score = 0;

        let weakMode = false;

        const LS_WRONG = 'sk_wrong_ids';
        const LS_STATS = 'sk_stats';

        function loadWrong() {
            try { return JSON.parse(localStorage.getItem(LS_WRONG)) || []; } catch(e) { return []; }
        }

        function saveWrong(arr) {
            try { localStorage.setItem(LS_WRONG, JSON.stringify(arr)); } catch(e) {}
        }

        function recordAnswer(q, isCorrect) {
            const id = getValue(q, ['全体通し番号', '通し番号']);
            let wrong = loadWrong();
            if (!isCorrect && id && !wrong.includes(id)) wrong.push(id);
            if (isCorrect && weakMode && id) wrong = wrong.filter(x => x !== id);
            saveWrong(wrong);
            let st = {};
            try { st = JSON.parse(localStorage.getItem(LS_STATS)) || {}; } catch(e) {}
            st.answered = (st.answered || 0) + 1;
            st.correct = (st.correct || 0) + (isCorrect ? 1 : 0);
            try { localStorage.setItem(LS_STATS, JSON.stringify(st)); } catch(e) {}
        }

        function updateStudyPanel() {
            const wrong = loadWrong();
            const cntEl = document.getElementById('weak-count');
            if (cntEl) cntEl.textContent = wrong.length;
            const wb = document.getElementById('weak-btn');
            if (wb) wb.disabled = (wrong.length === 0);
            let st = {};
            try { st = JSON.parse(localStorage.getItem(LS_STATS)) || {}; } catch(e) {}
            const sEl = document.getElementById('study-stats');
            if (sEl) {
                if (st.answered) {
                    const rate = Math.round(st.correct / st.answered * 100);
                    sEl.textContent = `📊 学習記録：通算 ${st.answered}問回答 ・ 正答率 ${rate}% ・ 苦手 ${wrong.length}問`;
                } else {
                    sEl.textContent = '📊 学習記録：まだ記録がありません。解いた問題の記録がここに貯まります。';
                }
            }
        }

        function startWeakQuiz() {
            const wrong = loadWrong();
            if (!wrong.length) { alert('苦手リストは空です。まずは普通に解いてみましょう。'); return; }
            weakMode = true;
            quizSet = masterData.filter(q => wrong.includes(getValue(q, ['全体通し番号', '通し番号'])));
            if (!quizSet.length) { alert('苦手リストの問題がデータ内に見つかりませんでした。'); return; }
            quizSet.sort(() => Math.random() - 0.5);
            const count = parseInt(document.getElementById('quiz-count').value);
            if (count < quizSet.length) quizSet = quizSet.slice(0, count);
            currentIndex = 0;
            score = 0;
            document.getElementById('setup-area').classList.remove('active');
            document.getElementById('quiz-area').classList.add('active');
            showQuestion();
        }

        function clearWrong() {
            if (confirm('苦手リストをすべて消しますか？')) { saveWrong([]); updateStudyPanel(); }
        }



        const MASTER_BASIC_SUBJECTS = [

            '医療概論', '衛生学・公衆衛生学', '関係法規', '解剖学', 

            '生理学', '病理学概論', '臨床医学総論', '臨床医学各論', 'リハビリテーション医学'

        ];



        const MASTER_SPECIAL_SUBJECTS = [

            '東洋医学概論', '経絡経穴概論', '東洋医学臨床論', 'はり理論', 'きゅう理論'

        ];



        function getValue(obj, keys) {

            if (!obj) return "";

            for (let k of keys) {

                if (obj[k] !== undefined && obj[k] !== null && obj[k] !== "") {

                    return String(obj[k]).trim();

                }

            }

            return "";

        }



        // 先頭の「1. 」「1．」などの数字記号を削除する関数

        function cleanOptionText(text) {

            if (!text) return "";

            return text.replace(/^[1-41-4１-４][.．\s ]+/, '').trim();

        }



        // **で囲まれた箇所を赤字強調表示用タグに変換する関数

        function formatText(text) {

            if (!text) return "";

            return text.replace(/\*\*(.*?)\*\*/g, '<span class="highlight">$1</span>');

        }



        window.onload = async function() {

            try {

                const response = await fetch(DATA_URL + '?t=' + new Date().getTime());

                const csvText = await response.text();

                masterData = parseCSV(csvText);

                

                updateFilters(masterData);

                

                if(masterData.length > 0) {

                    document.getElementById('status-msg').innerText = `✅ データ読み込み完了：全${masterData.length}問`;

                } else {

                    document.getElementById('status-msg').innerText = "⚠️ データが空です。data.csvを確認してください。";

                }

                

                document.getElementById('start-btn').disabled = false;

                document.getElementById('start-btn').innerText = "演習を開始する！";

                updateStudyPanel();

            } catch (e) {

                updateFilters([]);

                document.getElementById('status-msg').innerText = "⚠️ 同期失敗。data.csvを確認してください。";

            }

        };



        function parseCSV(text) {

            text = text.replace(/^\uFEFF/, '');

            const rows = [];

            let currentRow = [];

            let currentCell = '';

            let insideQuotes = false;



            for (let i = 0; i < text.length; i++) {

                const char = text[i];

                const nextChar = text[i + 1];



                if (char === '"') {

                    if (insideQuotes && nextChar === '"') {

                        currentCell += '"';

                        i++; 

                    } else {

                        insideQuotes = !insideQuotes;

                    }

                } else if (char === ',' && !insideQuotes) {

                    currentRow.push(currentCell.trim());

                    currentCell = '';

                } else if ((char === '\r' || char === '\n') && !insideQuotes) {

                    if (char === '\r' && nextChar === '\n') {

                        i++; 

                    }

                    currentRow.push(currentCell.trim());

                    if (currentRow.some(cell => cell.length > 0)) {

                        rows.push(currentRow);

                    }

                    currentRow = [];

                    currentCell = '';

                } else {

                    currentCell += char;

                }

            }



            if (currentCell.length > 0 || currentRow.length > 0) {

                currentRow.push(currentCell.trim());

                if (currentRow.some(cell => cell.length > 0)) {

                    rows.push(currentRow);

                }

            }



            if (rows.length < 2) return [];



            const headers = rows[0].map(h => h.replace(/^"|"$/g, '').trim());

            

            return rows.slice(1).map(row => {

                let obj = {};

                headers.forEach((h, i) => {

                    let val = row[i] !== undefined ? row[i].replace(/^"|"$/g, '').replace(/""/g, '"') : "";

                    obj[h] = val;

                });

                return obj;

            });

        }



        function updateFilters(data) {

            const years = [...new Set(data.map(q => getValue(q, ['試験の回数', '開催回', '回'])))].filter(Boolean).sort().reverse();

            const ys = document.getElementById('filter-year');

            ys.innerHTML = '<option value="all">すべて（全回）</option>';

            years.forEach(y => { ys.innerHTML += `<option value="${y}">${y}</option>`; });

            

            const csvSubjects = [...new Set(data.map(q => getValue(q, ['教科', '分野', '科目'])))].filter(Boolean);

            

            const basicList = [...MASTER_BASIC_SUBJECTS];

            const specialList = [...MASTER_SPECIAL_SUBJECTS];

            

            const otherList = csvSubjects.filter(s => 

                !basicList.some(b => s.includes(b) || b.includes(s)) &&

                !specialList.some(b => s.includes(b) || b.includes(s))

            );



            const container = document.getElementById('subject-checkboxes-container');

            container.innerHTML = '';



            const renderGroup = (title, list, categoryKey) => {

                if (list.length === 0) return;

                const titleDiv = document.createElement('div');

                titleDiv.className = 'subject-category-title';

                titleDiv.innerText = title;

                container.appendChild(titleDiv);



                const grid = document.createElement('div');

                grid.className = 'subject-grid';



                list.forEach(subj => {

                    const label = document.createElement('label');

                    label.className = 'subject-chip checked';

                    label.dataset.subject = subj;

                    label.dataset.category = categoryKey;



                    const cb = document.createElement('input');

                    cb.type = 'checkbox';

                    cb.value = subj;

                    cb.checked = true;

                    cb.className = 'subject-checkbox';

                    cb.onchange = (e) => {

                        label.classList.toggle('checked', e.target.checked);

                        refreshCategoryFilters(true);

                    };



                    label.appendChild(cb);

                    label.appendChild(document.createTextNode(subj));

                    grid.appendChild(label);

                });

                container.appendChild(grid);

            };



            renderGroup('専門基礎科目', basicList, 'basic');

            renderGroup('専門科目', specialList, 'special');

            renderGroup('その他・追加科目', otherList, 'other');

            document.getElementById('filter-year').onchange = () => refreshCategoryFilters(true);

            document.getElementById('filter-bigcat').onchange = () => refreshCategoryFilters(true);

            document.getElementById('filter-midcat').onchange = () => updateCatCount();

            refreshCategoryFilters(false);

        }



        function selectAllSubjects(checked) {

            document.querySelectorAll('.subject-checkbox').forEach(cb => {

                cb.checked = checked;

                cb.parentElement.classList.toggle('checked', checked);

            });

            refreshCategoryFilters(true);

        }



        function selectCategorySubjects(type) {

            document.querySelectorAll('.subject-checkbox').forEach(cb => {

                const label = cb.parentElement;

                const cat = label.dataset.category;

                const isTarget = (cat === type);



                cb.checked = isTarget;

                label.classList.toggle('checked', isTarget);

            });

            refreshCategoryFilters(true);

        }



        function currentBasePool() {

            const year = document.getElementById('filter-year').value;

            const selectedSubjects = Array.from(document.querySelectorAll('.subject-checkbox:checked')).map(cb => cb.value);

            return masterData.filter(q => {

                const qYear = getValue(q, ['試験の回数', '開催回', '回']);

                const qSubject = getValue(q, ['教科', '分野', '科目']);

                const matchYear = (year === 'all' || qYear === year);

                const matchSubject = selectedSubjects.some(s => qSubject.includes(s) || s.includes(qSubject));

                return matchYear && matchSubject;

            });

        }



        function catSortKey(v) {

            const m = String(v).match(/^\s*(\d+)/);

            return m ? parseInt(m[1]) : 999;

        }



        function refreshCategoryFilters(keepMid) {

            const bigSel = document.getElementById('filter-bigcat');

            const midSel = document.getElementById('filter-midcat');

            if (!bigSel || !midSel) return;

            const pool = currentBasePool();

            const prevBig = bigSel.value;

            const prevMid = midSel.value;

            const bigCounts = {};

            pool.forEach(q => { const b = getValue(q, ['大項目']); if (b) bigCounts[b] = (bigCounts[b] || 0) + 1; });

            const bigs = Object.keys(bigCounts).sort((a, b) => catSortKey(a) - catSortKey(b) || a.localeCompare(b, 'ja'));

            bigSel.innerHTML = '<option value="all">すべての大項目</option>' + bigs.map(b => `<option value="${b}">${b}（${bigCounts[b]}問）</option>`).join('');

            bigSel.value = bigs.includes(prevBig) ? prevBig : 'all';

            const pool2 = bigSel.value === 'all' ? pool : pool.filter(q => getValue(q, ['大項目']) === bigSel.value);

            const midCounts = {};

            pool2.forEach(q => { const mm = getValue(q, ['中項目']); if (mm) midCounts[mm] = (midCounts[mm] || 0) + 1; });

            const mids = Object.keys(midCounts).sort((a, b) => a.localeCompare(b, 'ja'));

            midSel.innerHTML = '<option value="all">すべての中項目</option>' + mids.map(mm => `<option value="${mm}">${mm}（${midCounts[mm]}問）</option>`).join('');

            midSel.value = (keepMid && mids.includes(prevMid)) ? prevMid : 'all';

            updateCatCount();

        }



        function updateCatCount() {

            const el = document.getElementById('cat-count');

            if (!el) return;

            const big = document.getElementById('filter-bigcat').value;

            const mid = document.getElementById('filter-midcat').value;

            let pool = currentBasePool();

            if (big !== 'all') pool = pool.filter(q => getValue(q, ['大項目']) === big);

            if (mid !== 'all') pool = pool.filter(q => getValue(q, ['中項目']) === mid);

            el.textContent = (big === 'all' && mid === 'all') ? '' : `この分野の問題は ${pool.length} 問あります`;

        }



        function startQuiz() {

            weakMode = false;

            const year = document.getElementById('filter-year').value;

            const startNum = parseInt(document.getElementById('num-start').value) || null;

            const endNum = parseInt(document.getElementById('num-end').value) || null;

            const orderMode = document.getElementById('order-mode').value;

            const count = parseInt(document.getElementById('quiz-count').value);

            

            const selectedSubjects = Array.from(document.querySelectorAll('.subject-checkbox:checked')).map(cb => cb.value);

            const bigCat = document.getElementById('filter-bigcat').value;

            const midCat = document.getElementById('filter-midcat').value;



            if (selectedSubjects.length === 0) {

                alert("教科を1つ以上選択してください。");

                return;

            }



            quizSet = masterData.filter(q => {

                const qYear = getValue(q, ['試験の回数', '開催回', '回']);

                const qSubject = getValue(q, ['教科', '分野', '科目']);

                const qNumStr = getValue(q, ['全体通し番号', '通し番号', '教科での番号', '試験の番号', '問題番号', '番号']) || "0";

                const qNum = parseInt(qNumStr.replace(/[^0-9]/g, '')) || 0;



                const matchYear = (year === 'all' || qYear === year);

                const matchSubject = selectedSubjects.some(s => qSubject.includes(s) || s.includes(qSubject));

                

                let matchRange = true;

                if (startNum !== null && qNum < startNum) matchRange = false;

                if (endNum !== null && qNum > endNum) matchRange = false;



                const matchBig = (bigCat === 'all' || getValue(q, ['大項目']) === bigCat);

                const matchMid = (midCat === 'all' || getValue(q, ['中項目']) === midCat);



                return matchYear && matchSubject && matchRange && matchBig && matchMid;

            });



            if(quizSet.length === 0) { 

                alert("指定した条件・教科に該当する問題が見つかりませんでした。"); 

                return; 

            }



            if (orderMode === 'random') {

                quizSet.sort(() => Math.random() - 0.5);

            } else {

                quizSet.sort((a, b) => {

                    const numA = parseInt((getValue(a, ['全体通し番号', '通し番号', '教科での番号', '試験の番号', '問題番号']) || "0").replace(/[^0-9]/g, '')) || 0;

                    const numB = parseInt((getValue(b, ['全体通し番号', '通し番号', '教科での番号', '試験の番号', '問題番号']) || "0").replace(/[^0-9]/g, '')) || 0;

                    return numA - numB;

                });

            }



            if(count < quizSet.length) quizSet = quizSet.slice(0, count);



            currentIndex = 0; 

            score = 0;



            document.getElementById('setup-area').classList.remove('active');

            document.getElementById('quiz-area').classList.add('active');

            showQuestion();

        }



        function showQuestion() {

            const q = quizSet[currentIndex];

            

            const progressPercent = ((currentIndex + 1) / quizSet.length) * 100;

            document.getElementById('progress-bar').style.width = `${progressPercent}%`;

            document.getElementById('quiz-progress-text').innerText = `${currentIndex + 1} / ${quizSet.length}問`;

            

            const examNum = getValue(q, ['試験の番号', '問題番号', '番号']);

            const examInfo = `${getValue(q, ['試験の回数', '開催回'])} ${examNum}`;

            document.getElementById('quiz-exam-info').innerText = examInfo;



            const subjectText = getValue(q, ['教科', '分野', '科目']);

            document.getElementById('badge-subject').innerText = subjectText;



            const categoryBadge = document.getElementById('badge-category');

            const bigCat = getValue(q, ['大項目', '大分類']);

            const midCat = getValue(q, ['中項目', '中分類']);

            const categoryText = [bigCat, midCat].filter(Boolean).join(' ＞ ');

            

            if (categoryText) {

                categoryBadge.innerText = categoryText;

                categoryBadge.style.display = 'inline-block';

            } else {

                categoryBadge.style.display = 'none';

            }



            // 問題文の **強調** 処理適用

            const rawQuestionText = getValue(q, ['問題', '問題文', '問']);

            document.getElementById('question-text').innerHTML = formatText(rawQuestionText);



            const container = document.getElementById('options-container');

            container.innerHTML = '';

            

            for(let i = 1; i <= 4; i++) {

                const rawOptText = getValue(q, [`選択肢${i}`, `選択肢 ${i}`, `肢${i}`]);

                if (!rawOptText) continue;



                // 先頭数字削除 ＆ **強調** 処理適用

                const optText = formatText(cleanOptionText(rawOptText));



                const btn = document.createElement('button');

                btn.className = 'option-btn';

                btn.innerHTML = `

                    <span class="option-num">${i}</span>

                    <span>${optText}</span>

                `;

                btn.onclick = () => checkAnswer(i, btn);

                container.appendChild(btn);

            }



            document.getElementById('explanation-box').style.display = 'none';

            document.getElementById('next-btn').style.display = 'none';

        }



        function checkAnswer(selected, btn) {

            const q = quizSet[currentIndex];

            q.userSelected = selected;

            const rawAnswer = getValue(q, ['答え', '正解', '解答']);

            const correctNums = (String(rawAnswer).match(/\d+/g) || []).map(Number);

            

            const btns = document.querySelectorAll('.option-btn');

            btns.forEach(b => b.disabled = true);



            if(correctNums.includes(selected)) {

                btn.classList.add('correct');

                score++;

                q.userCorrect = true;

            } else {

                btn.classList.add('wrong');

                correctNums.forEach(cn => { if(btns[cn-1]) btns[cn-1].classList.add('correct'); });

                q.userCorrect = false;

            }



            const expBox = document.getElementById('explanation-box');

            const expText = document.getElementById('explanation-text');

            expBox.style.display = 'block';



            const correctText = correctNums.map(cn => `${cn}. ` + formatText(cleanOptionText(getValue(q, [`選択肢${cn}`, `選択肢 ${cn}`]) || ''))).join(' ／ ');





            let explanationHTML = `<p style="font-weight:700; color:#1e293b; margin-bottom:8px;">正解：${correctText}</p>`;

            

            const expVal = getValue(q, ['解説', '問題解説']);

            if (expVal) { 

                // 解説文の **強調** 処理適用

                explanationHTML += `<hr style="border:0; border-top:1px solid #fde68a; margin:8px 0;"><p>${formatText(expVal)}</p>`; 

            }

            expText.innerHTML = explanationHTML;



            recordAnswer(q, correctNums.includes(selected));

            document.getElementById('next-btn').style.display = 'block';

        }



        function nextQuestion() {

            currentIndex++;

            if(currentIndex < quizSet.length) {

                showQuestion();

            } else {

                document.getElementById('quiz-area').classList.remove('active');

                document.getElementById('result-area').classList.add('active');

                

                const percentage = Math.round((score / quizSet.length) * 100);

                document.getElementById('score-percentage').innerText = `${percentage}%`;

                document.getElementById('score-detail').innerText = `${quizSet.length}問中 ${score}問 正解`;



                const listContainer = document.getElementById('review-list');

                listContainer.innerHTML = ''; 



                quizSet.forEach((q, i) => {

                    const li = document.createElement('li');

                    li.className = 'review-item';

                    

                    const isCorrect = q.userCorrect;

                    const icon = isCorrect 

                        ? '<span class="review-icon" style="color:var(--success);">◯</span>' 

                        : '<span class="review-icon" style="color:var(--error);">✖</span>';

                    

                    const qSubject = getValue(q, ['教科', '分野', '科目']);

                    const examNum = getValue(q, ['試験の番号', '問題番号', '番号']);

                    const qExam = `${getValue(q, ['試験の回数', '開催回'])} ${examNum}`;

                    

                    li.innerHTML = `

                        ${icon}

                        <div>

                            <span style="font-weight:bold; color:#475569; margin-right:6px;">Q${i + 1}.</span>

                            <span class="badge badge-subject" style="font-size:0.7rem; padding:2px 6px;">${qSubject}</span>

                            <span style="font-size:0.85rem; color:#64748b; margin-left:4px;">${qExam}</span>

                        </div>

                    `;

                    const det = document.createElement('details');
                    det.className = 'review-details';
                    const sum = document.createElement('summary');
                    sum.textContent = '問題と解説を見る';
                    det.appendChild(sum);
                    const body = document.createElement('div');
                    body.className = 'review-detail-body';
                    const correctNums = ((getValue(q, ['答え', '正解', '解答']) || '').match(/\d+/g) || []).map(Number);
                    let optsHtml = '';
                    for (let k = 1; k <= 4; k++) {
                        const ot = cleanOptionText(getValue(q, [`選択肢${k}`, `選択肢 ${k}`, `肢${k}`]) || '');
                        let mark = '';
                        let cls = '';
                        if (correctNums.includes(k)) { mark = ' ◯正解'; cls = ' is-correct'; }
                        if (q.userSelected === k && !correctNums.includes(k)) { mark = ' ✖あなたの回答'; cls = ' is-wrong'; }
                        optsHtml += `<div class="review-opt${cls}">${k}. ${formatText(ot)}${mark}</div>`;
                    }
                    const expVal2 = getValue(q, ['解説', '問題解説']);
                    body.innerHTML = `<div class="review-q">${formatText(getValue(q, ['問題', '問題文', '問']) || '')}</div>${optsHtml}` + (expVal2 ? `<div class="review-exp">${formatText(expVal2)}</div>` : '');
                    det.appendChild(body);
                    if (!isCorrect) det.open = true;
                    li.appendChild(det);

                    listContainer.appendChild(li);

                });

            }

        }

    </script>
